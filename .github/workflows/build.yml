name: Build

on:
  push:
    branches: ["main", "claude/**", "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: swift build (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Swift-Version anzeigen
        run: swift --version
      - name: Build
        run: swift build
      # HARTES GATE: Die Tests müssen mindestens KOMPILIEREN.
      #
      # Der Schritt darunter setzt continue-on-error (aus gutem Grund, siehe dort) –
      # damit fiel aber auch nicht auf, wenn ein Test nicht einmal übersetzbar war.
      # Genau das ist passiert: Zwei neue Testklassen riefen @MainActor-isolierte
      # Methoden synchron auf, der Bau der Testziele scheiterte, und die CI meldete
      # trotzdem Erfolg. `--build-tests` übersetzt sie, ohne sie auszuführen.
      - name: Tests kompilieren (Gate)
        run: swift build --build-tests

      # HARTES GATE: die reinen Logik-Tests.
      #
      # Vorher lief hier 'swift test' komplett mit continue-on-error – rote Tests
      # hielten die CI grün und die App wurde trotzdem paketiert. Der Grund für
      # continue-on-error war echt (einige SwiftData-In-Memory-Tests brechen im
      # headless CI mit SIGTRAP ab), aber die Konsequenz war zu grob: Es folgenlos
      # zu machen kostete den Schutz für ALLE Tests.
      #
      # Gezählt: 10 von 235 Testfunktionen brauchen einen ModelContainer. Genau die
      # werden übersprungen, die restlichen 225 sind ab jetzt blockierend.
      - name: Logik-Tests (hartes Gate)
        run: |
          swift test \
            --skip testPersistentModelsRoundTripRelationshipsAndCascadeDelete \
            --skip testPublicationReadinessBlocksTruncatedAndUnresolvedCriticalContent \
            --skip testCoverPromptIsBuiltFromBookIdentityAndKDPContext \
            --skip testCoverPromptRequestsTextFreeArtworkForOverlay \
            --skip testKDPSalesSheetContainsTitleHookDescriptionKeywordsAndCategories \
            --skip testRawBestTextPriority \
            --skip testScoresWithWellFormedChapter \
            --skip testProjectTotalWordCountUsesFastChapterCounts \
            --skip testConsistencyScoreDropsWithSevereIssues \
            --skip testCachedScoresInvalidateAfterSceneUpdate

      # HARTES GATE: die eigenständigen Prüfprogramme.
      #
      # Sie prüfen, was XCTest hier nicht abdeckt: die Schranke gegen Endlosschleifen
      # (SzenenBudget), Deep POV, Rechtschreibung nach der Reform, und das
      # Ereignis-Register gegen doppelt erzählte Szenen. Die Ereignis-Probe rechnet
      # ihre Schwelle bei jedem Lauf neu aus und schlägt fehl, wenn der Abstand
      # zwischen echten Dopplungen und bloß verwandten Szenen zusammenschrumpft –
      # eine Kalibrierung, die niemand vergessen kann.
      #
      # NovelForgeApp.swift bleibt draußen: Zwei @main-Typen in einem Modul
      # übersetzen nicht.
      - name: Prüfprogramme (hartes Gate)
        run: |
          SRC=$(find Sources/NovelForge -name '*.swift' ! -name 'NovelForgeApp.swift' | tr '\n' ' ')
          for probe in DeepPOVProbe EreignisProbe DialogProbe RueckgratProbe PlotGateProbe NamensProbe ChapterScorecardProbe OpeningQualityProbe; do
            echo "── $probe ──"
            swiftc -wmo -parse-as-library -module-name Probe \
              -o "/tmp/$probe" "Scripts/$probe.swift" $SRC
            "/tmp/$probe"
          done

      - name: SwiftData-Tests (nur Sichtbarkeit)
        # Diese zehn brauchen einen echten ModelContainer und trappen im headless
        # Runner. Sie laufen zur Information mit, blockieren aber nicht.
        continue-on-error: true
        run: swift test

  package:
    name: App-Bundle (macOS)
    runs-on: macos-15
    needs: build
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Node einrichten (für KDP-Sidecar)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: KDP-Sidecar-Abhängigkeiten (Puppeteer)
        run: cd kdp-sidecar && (npm ci --no-audit --no-fund || npm install --no-audit --no-fund)
      - name: App-Bundle bauen (inkl. gebündeltem Sidecar)
        run: bash Scripts/build-app.sh
      - name: DMG-Installer bauen
        run: bash Scripts/build-dmg.sh
      - name: Zip erstellen
        run: cd build && zip -r -y NovelForge-macOS.zip NovelForge.app
      - name: Artefakt hochladen
        # Schlägt nicht fehl, wenn die Artefakt-Speicherquota des Kontos
        # erschöpft ist – das Bundle-Bauen selbst bleibt verifiziert.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: NovelForge-macOS
          path: |
            build/NovelForge-macOS.zip
            build/NovelForge.dmg
          retention-days: 7
      - name: Release "app-latest" aktualisieren
        # Release-Assets zählen nicht gegen die Actions-Artefakt-Quota.
        # Liefert den jeweils neuesten main-Build als festen Download-Kanal (Zip + 1-Klick-DMG).
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes || true
          gh release create app-latest build/NovelForge-macOS.zip build/NovelForge.dmg \
            --title "NovelForge – aktueller Build (main)" \
            --notes "Automatischer Build von ${GITHUB_SHA}" \
            --latest=false
      - name: Getaggtes Release (v*) mit DMG
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/NovelForge.dmg build/NovelForge-macOS.zip --title "NovelForge ${GITHUB_REF_NAME}" --generate-notes
