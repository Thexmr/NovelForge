name: Build

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: swift build (macOS)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Swift-Version anzeigen
        run: swift --version
      - name: Build
        run: swift build
