name: Build

on:
  push:
    branches: ["main", "claude/**", "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: swift build (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Swift-Version anzeigen
        run: swift --version
      - name: Build
        run: swift build
      # HARTES GATE: Die Tests müssen mindestens KOMPILIEREN.
      #
      # Der Schritt darunter setzt continue-on-error (aus gutem Grund, siehe dort) –
      # damit fiel aber auch nicht auf, wenn ein Test nicht einmal übersetzbar war.
      # Genau das ist passiert: Zwei neue Testklassen riefen @MainActor-isolierte
      # Methoden synchron auf, der Bau der Testziele scheiterte, und die CI meldete
      # trotzdem Erfolg. `--build-tests` übersetzt sie, ohne sie auszuführen.
      - name: Tests kompilieren (Gate)
        run: swift build --build-tests

      - name: Tests
        # Läuft zur Sichtbarkeit, blockiert aber nicht die Paketierung: einige
        # SwiftData-In-Memory-Tests (mainContext) brechen im headless CI mit SIGTRAP ab,
        # obwohl die App mit echtem ModelContainer normal läuft. Das harte Gate ist
        # 'swift build' (App kompiliert). Reine Logik-Tests laufen zusätzlich als
        # Unit-Tests auf Android/Windows.
        continue-on-error: true
        run: swift test

  package:
    name: App-Bundle (macOS)
    runs-on: macos-15
    needs: build
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Node einrichten (für KDP-Sidecar)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: KDP-Sidecar-Abhängigkeiten (Puppeteer)
        run: cd kdp-sidecar && (npm ci --no-audit --no-fund || npm install --no-audit --no-fund)
      - name: App-Bundle bauen (inkl. gebündeltem Sidecar)
        run: bash Scripts/build-app.sh
      - name: DMG-Installer bauen
        run: bash Scripts/build-dmg.sh
      - name: Zip erstellen
        run: cd build && zip -r -y NovelForge-macOS.zip NovelForge.app
      - name: Artefakt hochladen
        # Schlägt nicht fehl, wenn die Artefakt-Speicherquota des Kontos
        # erschöpft ist – das Bundle-Bauen selbst bleibt verifiziert.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: NovelForge-macOS
          path: |
            build/NovelForge-macOS.zip
            build/NovelForge.dmg
          retention-days: 7
      - name: Release "app-latest" aktualisieren
        # Release-Assets zählen nicht gegen die Actions-Artefakt-Quota.
        # Liefert den jeweils neuesten main-Build als festen Download-Kanal (Zip + 1-Klick-DMG).
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes || true
          gh release create app-latest build/NovelForge-macOS.zip build/NovelForge.dmg \
            --title "NovelForge – aktueller Build (main)" \
            --notes "Automatischer Build von ${GITHUB_SHA}" \
            --latest=false
      - name: Getaggtes Release (v*) mit DMG
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/NovelForge.dmg build/NovelForge-macOS.zip --title "NovelForge ${GITHUB_REF_NAME}" --generate-notes
