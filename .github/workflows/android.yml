name: Android

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK bauen (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Gradle-Wrapper erzeugen
        run: gradle wrapper --gradle-version 8.7 --no-daemon
      - name: Build
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: APK hochladen
        continue-on-error: true # Artefakt-Speicherquota des Kontos kann erschöpft sein
        uses: actions/upload-artifact@v4
        with:
          name: NovelForge-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
